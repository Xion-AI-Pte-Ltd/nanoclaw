substitutions:
  _REGION: asia-east2
  _AR_REPO: marathon
  _IMAGE_NAME: nanoclaw-agent
  _IMAGE_TAG: latest
  _VM_NAME: vault-prod-hk-clone
  _VM_ZONE: asia-east2-a
  _VM_USER: alexandroskontogiorgos-heintz

steps:
  - name: gcr.io/cloud-builders/docker
    id: build-nanoclaw-agent
    args:
      - build
      - -f
      - container/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_IMAGE_NAME}:${_IMAGE_TAG}
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_IMAGE_NAME}:${_IMAGE_TAG}-$SHORT_SHA
      - ./container

  - name: gcr.io/cloud-builders/docker
    id: push-nanoclaw-agent-latest
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_IMAGE_NAME}:${_IMAGE_TAG}

  - name: gcr.io/cloud-builders/docker
    id: push-nanoclaw-agent-sha
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_IMAGE_NAME}:${_IMAGE_TAG}-$SHORT_SHA

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: stage-nanoclaw-agent-on-vm
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        gcloud compute ssh ${_VM_USER}@${_VM_NAME} \
          --zone=${_VM_ZONE} \
          --project=$PROJECT_ID \
          --command "sudo gcloud auth configure-docker ${_REGION}-docker.pkg.dev --quiet && \
                     sudo docker pull ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_IMAGE_NAME}:${_IMAGE_TAG}"

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_IMAGE_NAME}:${_IMAGE_TAG}
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_IMAGE_NAME}:${_IMAGE_TAG}-$SHORT_SHA

options:
  logging: CLOUD_LOGGING_ONLY
